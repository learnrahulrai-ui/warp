name: Warp 2282 CPU validation

on:
  push:
    branches: [ci/warp-2282-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      WARP_ENABLE_MEMPOOLS_AT_INIT: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      BASE_SHA: 703efa7e2a489f7e97906e760b937064eff6150c
    steps:
      - name: Check out validation driver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Preserve validation driver
        run: cp tools/ci/validate_warp_2282.py "$RUNNER_TEMP/validate_warp_2282.py"
      - name: Check out the proposed source change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: learnrahulrai-ui/fix-padded-tile-addressing
          fetch-depth: 2
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.6"
      - name: Prepare Python and evidence
        run: |
          uv python install
          uv sync --no-dev --no-install-project
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/commit.txt
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          cp warp/native/tile.h "$RUNNER_TEMP/fixed-tile.h"
          git show "$BASE_SHA:warp/native/tile.h" > warp/native/tile.h
      - name: Build original CPU backend
        run: uv run --no-sync build_lib.py --no-cuda --no-use-libmathdx -j 2 > evidence/build-baseline.log 2>&1
      - name: Confirm regression assertions fail on original source
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-2282-baseline-cache
        run: uv run python "$RUNNER_TEMP/validate_warp_2282.py" baseline --output evidence/baseline.json > evidence/baseline.log 2>&1
      - name: Restore the proposed header and rebuild CPU backend
        run: |
          cp "$RUNNER_TEMP/fixed-tile.h" warp/native/tile.h
          uv run build_lib.py --no-cuda --no-use-libmathdx -j 2 > evidence/build-fixed.log 2>&1
      - name: Run regressions with the fix
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-2282-fixed-cache
        run: uv run python "$RUNNER_TEMP/validate_warp_2282.py" fixed --output evidence/fixed.json > evidence/fixed.log 2>&1
      - name: Run existing tile load and indexed coverage
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-2282-fixed-cache
        run: |
          uv run python -m unittest -v \
            warp.tests.tile.test_tile_load \
            warp.tests.tile.test_tile_load_indexed \
            warp.tests.tile.test_tile_load_assign \
            warp.tests.tile.test_tile_load_extract > evidence/existing-tests.log 2>&1
      - name: Check formatting and repository hooks
        run: |
          uvx pre-commit run --files warp/native/tile.h warp/tests/tile/test_tile_padded.py warp/tests/unittest_suites.py changelog/2282.fixed.md > evidence/pre-commit.log 2>&1
          git diff --exit-code -- warp/native/tile.h warp/tests/tile/test_tile_padded.py warp/tests/unittest_suites.py changelog/2282.fixed.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-2282-cpu-evidence
          path: evidence/
          retention-days: 7
